<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'oklch(var(--background) / <alpha-value>)',
            foreground: 'oklch(var(--foreground) / <alpha-value>)',
            card: 'oklch(var(--card) / <alpha-value>)',
            'card-foreground': 'oklch(var(--card-foreground) / <alpha-value>)',
            popover: 'oklch(var(--popover) / <alpha-value>)',
            'popover-foreground': 'oklch(var(--popover-foreground) / <alpha-value>)',
            primary: 'oklch(var(--primary) / <alpha-value>)',
            'primary-foreground': 'oklch(var(--primary-foreground) / <alpha-value>)',
            secondary: 'oklch(var(--secondary) / <alpha-value>)',
            'secondary-foreground': 'oklch(var(--secondary-foreground) / <alpha-value>)',
            muted: 'oklch(var(--muted) / <alpha-value>)',
            'muted-foreground': 'oklch(var(--muted-foreground) / <alpha-value>)',
            accent: 'oklch(var(--accent) / <alpha-value>)',
            'accent-foreground': 'oklch(var(--accent-foreground) / <alpha-value>)',
            destructive: 'oklch(var(--destructive) / <alpha-value>)',
            border: 'oklch(var(--border) / <alpha-value>)',
            input: 'oklch(var(--input) / <alpha-value>)',
            'input-background': 'oklch(var(--input-background) / <alpha-value>)',
            ring: 'oklch(var(--ring) / <alpha-value>)'
          },
          borderRadius: { sm: '0.375rem', md: '0.5rem', lg: '0.625rem', xl: '0.875rem' },
          boxShadow: { md: '0 4px 6px oklch(0 0 0 / 0.07)' },
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --background: 1 0 0; --foreground: 0.141 0.005 285.823;
      --card: 1 0 0; --card-foreground: 0.141 0.005 285.823;
      --popover: 1 0 0; --popover-foreground: 0.141 0.005 285.823;
      --primary: 0.141 0.005 285.823; --primary-foreground: 0.985 0 0;
      --secondary: 0.967 0.001 286.375; --secondary-foreground: 0.21 0.006 285.885;
      --muted: 0.967 0.001 286.375; --muted-foreground: 0.552 0.016 285.938;
      --accent: 0.967 0.001 286.375; --accent-foreground: 0.21 0.006 285.885;
      --destructive: 0.577 0.245 27.325;
      --border: 0.92 0.004 286.32; --input: 0.92 0.004 286.32;
      --input-background: 0.967 0.001 286.375; --ring: 0.141 0.005 285.823;
    }
    .dark {
      --background: 0.141 0.005 285.823; --foreground: 0.985 0 0;
      --card: 0.21 0.006 285.885; --card-foreground: 0.985 0 0;
      --popover: 0.21 0.006 285.885; --popover-foreground: 0.985 0 0;
      --primary: 0.985 0 0; --primary-foreground: 0.141 0.005 285.823;
      --secondary: 0.274 0.006 286.033; --secondary-foreground: 0.985 0 0;
      --muted: 0.274 0.006 286.033; --muted-foreground: 0.705 0.015 286.067;
      --accent: 0.274 0.006 286.033; --accent-foreground: 0.985 0 0;
      --destructive: 0.704 0.191 22.216;
      --border: 0.38 0.006 286; --input: 0.45 0.006 286;
      --input-background: 0.19 0.006 286; --ring: 0.985 0 0;
    }
    body { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>
</head>
<body class="bg-background text-foreground">
  <section class="bg-background text-foreground">
    <div class="px-6 py-3 text-xs font-medium text-muted-foreground">Light</div>
    <header class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-border bg-card/80 px-4 backdrop-blur-sm lg:px-6">
      <div class="flex items-center gap-3">
        <div class="flex size-8 items-center justify-center rounded-lg bg-primary text-primary-foreground">
          <iconify-icon icon="lucide:layout-grid" width="18"></iconify-icon>
        </div>
        <span class="text-lg font-semibold text-foreground">App Store</span>
      </div>
      <div class="mx-4 hidden max-w-md flex-1 md:block">
        <div class="relative">
          <iconify-icon icon="lucide:search" width="16" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"></iconify-icon>
          <input type="text" placeholder="Search apps..." aria-label="Search apps"
            class="h-10 w-full rounded-lg border border-input bg-input-background pl-10 pr-4 text-sm text-foreground placeholder:text-muted-foreground outline-none transition focus:border-ring focus:ring-2 focus:ring-ring/20" />
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="relative flex size-10 items-center justify-center rounded-full text-foreground hover:bg-accent" aria-label="Notifications">
          <iconify-icon icon="lucide:bell" width="20"></iconify-icon>
          <span class="absolute right-2 top-2 size-2 rounded-full bg-destructive"></span>
        </button>
        <button class="flex size-9 items-center justify-center overflow-hidden rounded-full border border-border bg-muted text-muted-foreground" aria-label="User menu">
          <iconify-icon icon="lucide:user" width="18"></iconify-icon>
        </button>
      </div>
    </header>
  </section>
  <section class="dark bg-background text-foreground">
    <div class="px-6 py-3 text-xs font-medium text-muted-foreground">Dark</div>
    <header class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-border bg-card/80 px-4 backdrop-blur-sm lg:px-6">
      <div class="flex items-center gap-3">
        <div class="flex size-8 items-center justify-center rounded-lg bg-primary text-primary-foreground">
          <iconify-icon icon="lucide:layout-grid" width="18"></iconify-icon>
        </div>
        <span class="text-lg font-semibold text-foreground">App Store</span>
      </div>
      <div class="mx-4 hidden max-w-md flex-1 md:block">
        <div class="relative">
          <iconify-icon icon="lucide:search" width="16" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"></iconify-icon>
          <input type="text" placeholder="Search apps..." aria-label="Search apps"
            class="h-10 w-full rounded-lg border border-input bg-input-background pl-10 pr-4 text-sm text-foreground placeholder:text-muted-foreground outline-none transition focus:border-ring focus:ring-2 focus:ring-ring/20" />
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="relative flex size-10 items-center justify-center rounded-full text-foreground hover:bg-accent" aria-label="Notifications">
          <iconify-icon icon="lucide:bell" width="20"></iconify-icon>
          <span class="absolute right-2 top-2 size-2 rounded-full bg-destructive"></span>
        </button>
        <button class="flex size-9 items-center justify-center overflow-hidden rounded-full border border-border bg-muted text-muted-foreground" aria-label="User menu">
          <iconify-icon icon="lucide:user" width="18"></iconify-icon>
        </button>
      </div>
    </header>
  </section>
</body>
</html>
